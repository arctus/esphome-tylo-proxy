name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and compile the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Cache ESPHome toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
            ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('example/tylo-sauna.yaml') }}
          restore-keys: esphome-${{ runner.os }}-

      - name: Dummy secrets
        run: cp example/secrets.yaml.example example/secrets.yaml

      - name: Validate (Wi-Fi with fallback access point)
        run: esphome config example/tylo-sauna.yaml

      - name: Validate (access point only)
        run: |
          sed 's|network-fallback.yaml|network-ap-only.yaml|' example/tylo-sauna.yaml > example/tylo-sauna-ap.yaml
          esphome config example/tylo-sauna-ap.yaml

      - name: Compile
        run: esphome compile example/tylo-sauna.yaml

      - name: Collect firmware
        run: |
          # Only the two images a user flashes: factory (first USB flash) and
          # OTA. The build folder also holds ESP-IDF's bootloader, partition
          # table and CMake probe .bin files, which are not for users.
          mkdir -p firmware
          for f in firmware.factory.bin firmware.ota.bin; do
            src=$(find example/.esphome/build/tylo-sauna -name "$f" | head -n 1)
            test -n "$src" || { echo "missing $f"; exit 1; }
            cp "$src" "firmware/tylo-sauna-${f#firmware.}"
          done
          ls -la firmware

      - uses: actions/upload-artifact@v4
        with:
          name: example-firmware
          path: firmware/*.bin
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: example-firmware
          path: firmware

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: firmware/*.bin
