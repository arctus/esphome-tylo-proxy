text_sensor:
  - platform: sauna360
    heat_waves:
      name: "Heating Element"
      web_server:
        sorting_group_id: grp_heater
        sorting_weight: 21
  # Door and start-blocking messages from the heater's 0xB000 frames, e.g.
  # "Door opened too long, bath cancelled". The door sensor and external
  # switch are wired to the heater, so this is the only view of them.
  - platform: sauna360
    heater_state:
      name: "Heater Message"
      web_server:
        sorting_group_id: grp_heater
        sorting_weight: 22
  - platform: template
    name: "Heater Clock"
    icon: mdi:clock-outline
    update_interval: 30s
    lambda: return id(sauna360_component)->get_clock_text();
    web_server:
      sorting_group_id: grp_heater
      sorting_weight: 23

  # --- Session ---
  - platform: template
    name: "Opening Hours"
    icon: mdi:calendar-clock
    update_interval: 30s
    lambda: return id(sauna360_component)->get_opening_hours_state();
    web_server:
      sorting_group_id: grp_session
      sorting_weight: 0

  - platform: template
    name: "Session State"
    icon: mdi:state-machine
    update_interval: 2s
    lambda: return id(sauna360_component)->get_session_state();
    web_server:
      sorting_group_id: grp_session
      sorting_weight: 1

  # --- Statistics ---
  - platform: template
    name: "Recent Sessions"
    icon: mdi:history
    update_interval: 30s
    lambda: return id(sauna360_component)->get_recent_sessions_text();
    web_server:
      sorting_group_id: grp_stats
      sorting_weight: 10
  - platform: template
    name: "Full History and Clock Sync"
    icon: mdi:link-variant
    update_interval: 30s
    lambda: return id(sauna_wifi_id).page_url("/sauna");
    web_server:
      sorting_group_id: grp_stats
      sorting_weight: 11

  # --- Diagnostics ---
  - platform: template
    name: "Network"
    icon: mdi:wifi
    update_interval: 10s
    lambda: return id(sauna_wifi_id).status_text();
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 19
  - platform: template
    name: "Uptime"
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      const uint32_t s = (uint32_t) id(esp_uptime_seconds).state;
      char buf[32];
      snprintf(buf, sizeof(buf), "%ud %uh %um", (unsigned) (s / 86400),
               (unsigned) ((s / 3600) % 24), (unsigned) ((s / 60) % 60));
      return {buf};
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 20
  - platform: template
    name: "Config Version"
    icon: mdi:tag-outline
    update_interval: 3600s
    lambda: return {"${config_version}"};
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 21
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 22
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 23
